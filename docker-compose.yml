# Local full-stack: web (Next.js) + api (Express) + MongoDB.
#
#   cp apps/api/.env.example .env     # fill in JWT secrets (+ Cloudinary/SMTP if you have them)
#   docker compose up --build
#
#   web → http://localhost:3000   api → http://localhost:4000
# MONGODB_URI is overridden below to point at the bundled mongo container.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/college_junction
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me-please}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me-please}
      JWT_EMAIL_SECRET: ${JWT_EMAIL_SECRET:-dev-email-secret-change-me-please}
      BOOTSTRAP_ADMIN: ${BOOTSTRAP_ADMIN:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin12345}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-College Junction <no-reply@collegejunction.com>}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DISABLE_RATE_LIMIT: ${DISABLE_RATE_LIMIT:-false}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Same-origin mode: the browser only talks to this host; Next.js proxies
      # /api/* to the API container. Leave NEXT_PUBLIC_API_URL unset.
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  mongo-data:
